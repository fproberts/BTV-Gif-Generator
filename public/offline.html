<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPixel Offline BLE Controller</title>
    <link rel="manifest" href="/manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
    <style>
        :root {
            --bg: #09090b;
            --panel: #18181b;
            --primary: #a855f7;
            --emerald: #10b981;
            --text: #f4f4f5;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 1rem; max-width: 500px; margin: 0 auto; }
        h1 { font-size: 1.5rem; color: var(--primary); text-align: center; margin-bottom: 0.5rem; }
        p.subtitle { font-size: 0.85rem; color: #a1a1aa; text-align: center; margin-bottom: 1.5rem; }
        .card { background: var(--panel); border: 1px solid #27272a; border-radius: 1rem; padding: 1.25rem; margin-bottom: 1rem; }
        label { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; color: #a1a1aa; display: block; margin-bottom: 0.4rem; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 0.75rem; background: #09090b; border: 1px solid #3f3f46; border-radius: 0.5rem; color: #fff; margin-bottom: 1rem; }
        .btn { width: 100%; padding: 0.85rem; border: none; border-radius: 0.5rem; font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: 0.2s; margin-bottom: 0.5rem; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-emerald { background: var(--emerald); color: #000; }
        .btn-outline { background: transparent; border: 1px solid #3f3f46; color: #fff; }
        .status { text-align: center; padding: 0.6rem; font-size: 0.85rem; font-weight: bold; border-radius: 0.5rem; margin-bottom: 1rem; transition: all 0.3s; }
        .status.disconnected { background: #3f3f46; color: #a1a1aa; }
        .status.connected { background: rgba(16, 185, 129, 0.2); color: var(--emerald); border: 1px solid var(--emerald); }
        .status.busy { background: rgba(168, 85, 247, 0.2); color: var(--primary); border: 1px solid var(--primary); }
        canvas { width: 100%; height: 32px; background: #000; image-rendering: pixelated; border-radius: 4px; margin-bottom: 1rem; }
        .note { font-size: 0.75rem; color: #a1a1aa; background: #18181b; border-left: 3px solid var(--primary); padding: 0.5rem 0.75rem; margin-bottom: 1rem; border-radius: 0 0.5rem 0.5rem 0; }
    </style>
</head>
<body>

    <h1>⚡ iPixel Offline BLE</h1>
    <p class="subtitle">Direct Phone-to-Screen Bluetooth Control</p>

    <div class="note">
        💡 <b>iOS Notice</b>: Apple Safari/Chrome disable Web Bluetooth. On iPhone/iPad, open this page in the free <b>Bluefy</b> app from the App Store. On Android/Mac/PC, use Chrome or Edge!
    </div>

    <div id="status" class="status disconnected">Status: Disconnected</div>

    <button id="btnConnect" class="btn btn-emerald">🔌 Connect to iPixel Screen</button>

    <div class="card">
        <label>Live Text Message</label>
        <input type="text" id="textInput" value="OFFLINE BLE!" placeholder="Type text here...">
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
            <input type="color" id="textColor" value="#00ff00" style="height: 40px; border: none; background: transparent; cursor: pointer;">
            <input type="color" id="bgColor" value="#000000" style="height: 40px; border: none; background: transparent; cursor: pointer;">
        </div>
        <button id="btnSendText" class="btn btn-primary">📺 Send Text to Screen</button>
    </div>

    <div class="card">
        <label>Upload Image / GIF from Phone</label>
        <input type="file" id="fileInput" accept="image/*,.gif">
        <canvas id="previewCanvas" width="96" height="16"></canvas>
        <button id="btnSendImage" class="btn btn-primary">📺 Send Image / GIF to Screen</button>
    </div>

    <div class="card">
        <label>Screen Controls</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
            <button id="btnBright50" class="btn btn-outline">Brightness 50%</button>
            <button id="btnBright100" class="btn btn-outline">Brightness 100%</button>
            <button id="btnClock" class="btn btn-outline">Clock Mode</button>
            <button id="btnClear" class="btn btn-outline">Clear Memory</button>
        </div>
    </div>

<script>
// ─── Web Bluetooth Protocol Implementation for iPixel ─────────────────
const WRITE_UUID  = "0000fa02-0000-1000-8000-00805f9b34fb";
const NOTIFY_UUID = "0000fa03-0000-1000-8000-00805f9b34fb";
const SERVICE_UUID = "000000fa-0000-1000-8000-00805f9b34fb";
const WINDOW_SIZE = 12288; // 12 KB per window frame

let device = null;
let writeChar = null;
let notifyChar = null;
let selectedFile = null;

const statusEl = document.getElementById("status");

function updateStatus(text, type = "disconnected") {
    statusEl.innerText = `Status: ${text}`;
    statusEl.className = `status ${type}`;
}

function parseHexColor(hex) {
    let c = hex.replace("#", "");
    if (c.length === 3) c = c.split("").map(x => x + x).join("");
    const num = parseInt(c, 16);
    if (isNaN(num)) return { r: 255, g: 255, b: 255 };
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}

// CRC32 Algorithm (IEEE 802.3)
function crc32(bytes) {
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
        crc ^= bytes[i];
        for (let j = 0; j < 8; j++) {
            crc = (crc >>> 1) ^ ((crc & 1) ? 0xEDB88320 : 0);
        }
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
}

// ─── BLE Connection ───────────────────────────────────────────────────
document.getElementById("btnConnect").addEventListener("click", async () => {
    if (!navigator.bluetooth) {
        updateStatus("Web Bluetooth not supported in browser", "disconnected");
        return;
    }

    try {
        updateStatus("Scanning for BLE...", "busy");
        device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: "LED_BLE" }],
            optionalServices: [SERVICE_UUID, "0000fa00-0000-1000-8000-00805f9b34fb"]
        });

        updateStatus("Connecting GATT...", "busy");
        const server = await device.gatt.connect();

        let service;
        try {
            service = await server.getPrimaryService(SERVICE_UUID);
        } catch {
            const services = await server.getPrimaryServices();
            service = services[0];
        }

        writeChar = await service.getCharacteristic(WRITE_UUID);
        try {
            notifyChar = await service.getCharacteristic(NOTIFY_UUID);
            await notifyChar.startNotifications();
        } catch (e) { console.log("Notify setup warning:", e); }

        updateStatus(`Connected to ${device.name || "iPixel"}`, "connected");
    } catch (e) {
        updateStatus("Connection failed: " + e.message, "disconnected");
    }
});

// ─── Low Level Chunked Send with BLE Delay ────────────────────────────
async function sendRawCommand(bytes) {
    if (!writeChar) {
        updateStatus("Connect Bluetooth first!", "disconnected");
        return;
    }
    const CHUNK = 244;
    for (let i = 0; i < bytes.length; i += CHUNK) {
        const chunk = bytes.slice(i, i + CHUNK);
        if (writeChar.writeValueWithResponse) {
            await writeChar.writeValueWithResponse(chunk);
        } else {
            await writeChar.writeValue(chunk);
        }
        await new Promise(r => setTimeout(r, 20)); // Inter-chunk BLE delay
    }
}

async function sendWindowFrames(payloadBytes, isGif = false) {
    if (!writeChar) {
        updateStatus("Connect Bluetooth first!", "disconnected");
        return;
    }

    const totalSize = payloadBytes.length;
    const crcVal = crc32(payloadBytes);

    const cmdByte = isGif ? 0x03 : 0x02;
    const typeByte = isGif ? 0x02 : 0x00;

    let pos = 0;
    let windowIndex = 0;
    const totalWindows = Math.ceil(totalSize / WINDOW_SIZE) || 1;

    try {
        while (pos < totalSize) {
            const windowEnd = Math.min(pos + WINDOW_SIZE, totalSize);
            const chunkData = payloadBytes.subarray(pos, windowEnd);
            const option = (windowIndex === 0) ? 0x00 : 0x02;

            const header = new Uint8Array(13);
            header[0] = cmdByte;
            header[1] = 0x00;
            header[2] = option;

            new DataView(header.buffer).setUint32(3, totalSize, true);
            new DataView(header.buffer).setUint32(7, crcVal, true);
            header[11] = typeByte;
            header[12] = 0x00; // slot

            const frame = new Uint8Array(header.length + chunkData.length);
            frame.set(header, 0);
            frame.set(chunkData, header.length);

            const prefix = new Uint8Array(2);
            new DataView(prefix.buffer).setUint16(0, frame.length + 2, true);

            const fullMsg = new Uint8Array(prefix.length + frame.length);
            fullMsg.set(prefix, 0);
            fullMsg.set(frame, prefix.length);

            updateStatus(`Streaming window ${windowIndex + 1}/${totalWindows}...`, "busy");
            await sendRawCommand(fullMsg);

            windowIndex++;
            pos = windowEnd;
        }

        updateStatus(`Sent ${isGif ? 'GIF' : 'Image'} successfully!`, "connected");
    } catch (e) {
        updateStatus("Error streaming payload: " + e.message, "disconnected");
    }
}

// ─── Render Text to Canvas with Crisp Thresholding ───────────────────
function renderTextPNG(text, textColor, bgColor) {
    const canvas = document.createElement("canvas");
    canvas.width = 96;
    canvas.height = 16;
    const ctx = canvas.getContext("2d");

    if (ctx) {
        ctx.imageSmoothingEnabled = false;

        const bgRgb = parseHexColor(bgColor);
        ctx.fillStyle = `rgb(${bgRgb.r}, ${bgRgb.g}, ${bgRgb.b})`;
        ctx.fillRect(0, 0, 96, 16);

        const textRgb = parseHexColor(textColor);
        ctx.fillStyle = `rgb(${textRgb.r}, ${textRgb.g}, ${textRgb.b})`;
        ctx.font = "bold 12px Arial, Helvetica, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, 48, 8.5);

        // Crisp pixel thresholding
        const imgData = ctx.getImageData(0, 0, 96, 16);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
            const diff = Math.abs(r - bgRgb.r) + Math.abs(g - bgRgb.g) + Math.abs(b - bgRgb.b);

            if (a > 60 && diff > 50) {
                data[i] = textRgb.r;
                data[i + 1] = textRgb.g;
                data[i + 2] = textRgb.b;
                data[i + 3] = 255;
            } else {
                data[i] = bgRgb.r;
                data[i + 1] = bgRgb.g;
                data[i + 2] = bgRgb.b;
                data[i + 3] = 255;
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    const prevCtx = document.getElementById("previewCanvas").getContext("2d");
    prevCtx.drawImage(canvas, 0, 0);

    return new Promise((resolve) => {
        canvas.toBlob(async (blob) => {
            const buf = await blob.arrayBuffer();
            resolve(new Uint8Array(buf));
        }, "image/png");
    });
}

// ─── UI Actions ───────────────────────────────────────────────────────
document.getElementById("btnSendText").addEventListener("click", async () => {
    try {
        const text = document.getElementById("textInput").value;
        const textCol = document.getElementById("textColor").value;
        const bgCol = document.getElementById("bgColor").value;
        const pngBytes = await renderTextPNG(text, textCol, bgCol);
        await sendWindowFrames(pngBytes, false);
    } catch (e) {
        updateStatus("Error: " + e.message, "disconnected");
    }
});

document.getElementById("fileInput").addEventListener("change", (e) => {
    if (e.target.files.length > 0) {
        selectedFile = e.target.files[0];
    }
});

document.getElementById("btnSendImage").addEventListener("click", async () => {
    try {
        if (!selectedFile) {
            updateStatus("Please select a file first!", "disconnected");
            return;
        }
        const isGif = selectedFile.name.toLowerCase().endsWith(".gif");
        const buf = await selectedFile.arrayBuffer();
        const bytes = new Uint8Array(buf);

        if (!isGif) {
            const img = new Image();
            img.src = URL.createObjectURL(selectedFile);
            await img.decode();

            const canvas = document.createElement("canvas");
            canvas.width = 96;
            canvas.height = 16;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, 96, 16);

            canvas.toBlob(async (blob) => {
                const pngBuf = await blob.arrayBuffer();
                await sendWindowFrames(new Uint8Array(pngBuf), false);
            }, "image/png");
        } else {
            await sendWindowFrames(bytes, true);
        }
    } catch (e) {
        updateStatus("Error sending file: " + e.message, "disconnected");
    }
});

document.getElementById("btnBright50").addEventListener("click", () => sendRawCommand(new Uint8Array([5, 0, 4, 0x80, 50])));
document.getElementById("btnBright100").addEventListener("click", () => sendRawCommand(new Uint8Array([5, 0, 4, 0x80, 100])));
document.getElementById("btnClock").addEventListener("click", () => sendRawCommand(new Uint8Array([11, 0, 6, 1, 1, 1, 1, 26, 7, 21, 2])));
document.getElementById("btnClear").addEventListener("click", () => sendRawCommand(new Uint8Array([4, 0, 3, 0x80])));
</script>

</body>
</html>
